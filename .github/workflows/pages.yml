name: Deploy French learning app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "french_course/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Check front-end]
    types: [completed]
    branches: [front-end]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: front-end
      - uses: actions/checkout@v4
        with:
          ref: main
          path: course-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the lesson data from this revision
        run: |
          python3 course-source/french_course/build.py
          cp course-source/french_course/french_course.sqlite french_course/french_course.sqlite
          python3 web/export_course.py
      - name: Cache the French neural clips
        id: audio-cache
        uses: actions/cache@v4
        with:
          path: web/audio
          restore-keys: parole-audio-v1-
          key: parole-audio-v1-${{ hashFiles('web/generate_pronunciation.py', 'french_course/french_course.sqlite') }}
      - name: Generate French pronunciation audio
        timeout-minutes: 40
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '30'
          PIP_DEFAULT_TIMEOUT: '20'
          PIP_RETRIES: '2'
        run: |
          if [ "${{ steps.audio-cache.outputs.cache-hit }}" = true ] && [ -s web/audio/index.json ]; then exit 0; fi
          rm -f web/audio/index.json
          trap 'if [ ! -s web/audio/index.json ]; then rm -rf web/audio; fi' EXIT
          python3 -m venv "$RUNNER_TEMP/parole-voice"
          source "$RUNNER_TEMP/parole-voice/bin/activate"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1'
          python -m pip install 'kokoro==0.9.4' 'misaki[en]==0.9.4' 'transformers==4.51.3' 'imageio-ffmpeg==0.6.0'
          python web/generate_pronunciation.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
